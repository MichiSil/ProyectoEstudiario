openapi: 3.0.3

info:
  title: Estudiario – Generar un plan de estudio
  version: 1.0.0
  description: |
    Capacidad publicada por **Estudiario** para que el sistema de otro grupo genere
    un **plan de estudio** a partir de los datos de un examen y de una disponibilidad
    horaria (RF-13 del [SPEC](../../SPEC.md)).

    La expone directamente **planner-service** (no pasa por el api-gateway de Estudiario).
    La guía de uso, la política de versionado y los ejemplos con `curl` están en
    [`docs/contracts/README.md`](README.md). Las decisiones de diseño están en el
    [ADR-008](../adr/ADR-008-contrato-propio.md).

    ## Qué devuelve

    Una **propuesta** de sesiones de estudio (fecha, horario, duración, tema, objetivo y
    explicación). Es sólo una sugerencia: Estudiario **no guarda ni reserva** las sesiones
    del consumidor (RN-08) y **no conoce su calendario**, así que cada pedido es
    independiente. Evitar choques con otras actividades del usuario es responsabilidad
    del sistema consumidor.

    ## Garantías de cada propuesta

    Toda respuesta `200` cumple siempre, sin importar si la armó la IA o el motor de reglas:

    1. **Ventana de estudio (RN-06).** Las sesiones caen entre `window.from` y `window.to`.
       `window.to` es el día anterior al examen y `window.from` es el más tardío entre
       `startDate` y la fecha del examen menos la anticipación según la dificultad:
       fácil 5 días, media 10, difícil 15 y muy difícil 21.
    2. **Dentro de la disponibilidad.** Cada sesión empieza y termina dentro de una de las
       franjas semanales enviadas, en la zona horaria `timezone`.
    3. **Sin superposiciones.** Ninguna sesión de la propuesta se superpone con otra.
    4. **Capacidad diaria.** La suma de minutos de un mismo día no supera `maxDailyMinutes`.
    5. **Duración fija.** Cada sesión dura `preferredSessionMinutes`, o `maxDailyMinutes`
       si es menor. En v1 no se proponen sesiones más cortas.
    6. **Cantidad y repaso (RN-07).** La cantidad de sesiones crece con la dificultad y con
       la cantidad de temas. Las sesiones están en orden cronológico y, desde 3 sesiones,
       las últimas son de `simulacro` o `repaso`.

    Si la IA no responde a tiempo o propone algo que no cumple estas garantías, la
    propuesta se arma con el motor de reglas (RN-09): la respuesta sigue siendo `200`,
    con `generatedBy: reglas` y la advertencia `AI_FALLBACK`.

    ## Convenciones

    - Fechas en formato `YYYY-MM-DD` y horas en formato `HH:mm` (24 h), siempre **locales**
      a la zona horaria `timezone` del pedido.
    - Los errores siguen el formato *Problem Details* (RFC 9457) con un `code` estable que
      es el que hay que usar para decidir qué hacer.
    - **Lector tolerante:** el consumidor debe ignorar los campos que no conozca y aceptar
      valores nuevos en `warnings[].code` y `sessions[].kind`. Agregarlos no es un cambio
      incompatible (ver la política de versionado).
  contact:
    name: Grupo Estudiario – Arquitectura de Software 2026 (UCC)
    url: https://github.com/MichiSil/ProyectoEstudiario

