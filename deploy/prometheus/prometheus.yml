# Prometheus de Estudiario (ADR-011). Junta las métricas de los cinco servicios
# desde su GET /metrics, en el puerto 9100 de la red interna de Docker (no se
# publica ni pasa por el api-gateway). Las dos instancias de forum-service se
# leen por separado, cada una con su nombre (ADR-012).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api-gateway
    static_configs:
      - targets: ["api-gateway:9100"]
        labels: { instance: api-gateway }
  - job_name: users-service
    static_configs:
      - targets: ["users-service:9100"]
        labels: { instance: users-service }
  - job_name: planner-service
    static_configs:
      - targets: ["planner-service:9100"]
        labels: { instance: planner-service }
  - job_name: forum-service
    static_configs:
      - targets: ["forum-service:9100"]
        labels: { instance: forum-service-1 }
      - targets: ["forum-service-2:9100"]
        labels: { instance: forum-service-2 }
  - job_name: notification-service
    static_configs:
      - targets: ["notification-service:9100"]
        labels: { instance: notification-service }
