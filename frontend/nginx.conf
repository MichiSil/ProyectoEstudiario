server {
    listen 80;
    root /usr/share/nginx/html;

    # Todo pedido a la API va al api-gateway, el único punto de entrada (ADR-001).
    # Los timeouts quedan por encima de los del gateway (12 s para la propuesta).
    location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 20s;
        # Los PDF del foro y del material pueden pesar hasta 10 MB (RN-20). nginx
        # acepta por defecto sólo 1 MB y respondía 413 antes de llegar al gateway.
        # 11 MB deja lugar para el resto del formulario multipart.
        client_max_body_size 11m;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # El mime.types de nginx no conoce .webmanifest: sin esto Android ignora el manifest.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # index.html nunca se guarda en el navegador: así cada entrada trae la última
    # versión (los archivos de /assets/ tienen hash en el nombre y sí se guardan).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Rutas del frontend (React Router): siempre index.html.
    location / {
        try_files $uri /index.html;
    }
}
