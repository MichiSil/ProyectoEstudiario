<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <meta name="description" content="Organizá tu semana de estudio: materias, calendario de exámenes y un plan de estudio armado por un agente de IA." />
    <meta name="theme-color" content="#f5f2ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1d21" media="(prefers-color-scheme: dark)" />

    <link rel="shortcut icon" href="/favicon.ico?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Vista previa al compartir el link (WhatsApp, Instagram, X, etc.). Las URL
         tienen que ser absolutas: si cambia el dominio del despliegue, cambiarlas acá. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Estudiario" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:url" content="https://estudiario-ucc.chilecentral.cloudapp.azure.com/" />
    <meta property="og:title" content="Estudiario" />
    <meta property="og:description" content="Organizá tu semana de estudio: materias, calendario de exámenes y un plan de estudio armado por un agente de IA." />
    <!-- Cuadrada primero: WhatsApp muestra una miniatura cuadrada y recorta las anchas. -->
    <meta property="og:image" content="https://estudiario-ucc.chilecentral.cloudapp.azure.com/og-image-square.png?v=4" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Logo de Estudiario" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Estudiario" />
    <meta name="twitter:description" content="Organizá tu semana de estudio: materias, calendario de exámenes y un plan de estudio armado por un agente de IA." />
    <meta name="twitter:image" content="https://estudiario-ucc.chilecentral.cloudapp.azure.com/og-image.png?v=3" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Estudiario" />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>Estudiario</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
