# Levanta todo Estudiario en local con un único comando:
#
#   cp .env.example .env
#   docker compose up --build
#
# Puertos y URLs: ver "Cómo levantar el sistema" en el README.
#
# En la Entrega 2 sólo funciona planner-service (pedir y confirmar el plan) con
# PostgreSQL. Los demás servicios son esqueletos que responden GET /health.

name: estudiario

x-go-service: &go-service
  restart: unless-stopped
  init: true

services:
  # ---------------------------------------------------------------
  # Servicios propios (Go)
  # ---------------------------------------------------------------
  api-gateway:
    <<: *go-service
    build: ./services/api-gateway
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      PLANNER_SERVICE_URL: http://planner-service:8082
      USERS_SERVICE_URL: http://users-service:8081
      FORUM_SERVICE_URL: http://forum-service:8083
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      # Secreto para validar los JWT y secreto compartido con planner-service y users-service.
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en el .env (ver .env.example)}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?falta INTERNAL_TOKEN en el .env (ver .env.example)}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      planner-service:
        condition: service_healthy
      users-service:
        condition: service_healthy
      forum-service:
        condition: service_healthy
      jaeger:
        condition: service_started

  planner-service:
    <<: *go-service
    build: ./services/planner-service
    # Publicado directamente: la capacidad para otros grupos no pasa por el api-gateway (ADR-008).
    ports:
      - "8082:8082"
    environment:
      PORT: "8082"
      DATABASE_URL: postgres://${PLANNER_DB_USER}:${PLANNER_DB_PASSWORD}@postgres:5432/planner?sslmode=disable
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      # Sólo acepta X-User-Id de pedidos que traen este secreto (los del api-gateway).
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?falta INTERNAL_TOKEN en el .env (ver .env.example)}
      # Agente de IA (Groq). Sin AI_API_KEY, el plan se arma con el motor de reglas (RN-09).
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_TIMEOUT: ${AI_TIMEOUT:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      db-init:
        condition: service_completed_successfully
      jaeger:
        condition: service_started

  users-service:
    <<: *go-service
    build: ./services/users-service
    ports:
      - "8081:8081"
    environment:
      PORT: "8081"
      # Base propia `users` con su propio usuario (ADR-001, ADR-003).
      DATABASE_URL: postgres://${USERS_DB_USER}:${USERS_DB_PASSWORD}@postgres:5432/users?sslmode=disable
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      # Firma los JWT con el mismo secreto que usa el api-gateway para validarlos.
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en el .env (ver .env.example)}
      # GET /me sólo acepta X-User-Id de pedidos que traen este secreto (los del api-gateway).
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?falta INTERNAL_TOKEN en el .env (ver .env.example)}
      # Mails con rol admin (RF-03); se aplica en cada login.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      db-init:
        condition: service_completed_successfully
      jaeger:
        condition: service_started

  forum-service:
    <<: *go-service
    build: ./services/forum-service
    # Publicado directamente: la capacidad para otros grupos (/v1/*) no pasa por el api-gateway (ADR-014).
    ports:
      - "8083:8083"
    environment:
      PORT: "8083"
      # Base `forum` en MongoDB y bucket `summaries` en MinIO, con usuarios propios (ADR-003).
      MONGO_URI: mongodb://${FORUM_DB_USER}:${FORUM_DB_PASSWORD}@mongo:27017/forum?authSource=forum
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${FORUM_MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${FORUM_MINIO_SECRET_KEY}
      MINIO_BUCKET: summaries
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      # La API del foro sólo acepta X-User-Id de pedidos que traen este secreto (los del api-gateway).
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?falta INTERNAL_TOKEN en el .env (ver .env.example)}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      jaeger:
        condition: service_started

  notification-service:
    <<: *go-service
    build: ./services/notification-service
    ports:
      - "8084:8084"
    environment:
      PORT: "8084"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------
  # Mock de la capacidad publicada (docs/contracts/)
  # ---------------------------------------------------------------
  contract-mock:
    image: stoplight/prism:5
    command: mock -h 0.0.0.0 -p 4010 --multiprocess=false /contracts/documents-v1.yaml
    ports:
      - "4010:4010"
    volumes:
      - ./docs/contracts:/contracts:ro
    restart: unless-stopped

  # ---------------------------------------------------------------
  # Almacenamiento
  # ---------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: planner
      # Administrador del contenedor: sólo lo usa db-init, ningún servicio se conecta con él.
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?falta POSTGRES_ADMIN_USER en el .env (copiá de nuevo .env.example a .env)}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?falta POSTGRES_ADMIN_PASSWORD en el .env (copiá de nuevo .env.example a .env)}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d planner"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Crea el usuario y la base de cada servicio (planner y users), sin superusuario
  # y sin acceso a la base del otro. Corre una vez en cada `up` y termina; el
  # script es idempotente, así sirve también con un volumen que ya existía.
  db-init:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: planner
      PGUSER: ${POSTGRES_ADMIN_USER}
      PGPASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      PLANNER_DB_USER: ${PLANNER_DB_USER:?falta PLANNER_DB_USER en el .env (ver .env.example)}
      PLANNER_DB_PASSWORD: ${PLANNER_DB_PASSWORD:?falta PLANNER_DB_PASSWORD en el .env (ver .env.example)}
      USERS_DB_USER: ${USERS_DB_USER:?falta USERS_DB_USER en el .env (ver .env.example)}
      USERS_DB_PASSWORD: ${USERS_DB_PASSWORD:?falta USERS_DB_PASSWORD en el .env (ver .env.example)}
    volumes:
      - ./deploy/postgres:/scripts:ro
    entrypoint: ["sh", "/scripts/init-databases.sh"]
    restart: "no"

  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    environment:
      # Administrador del contenedor: sólo lo usa mongo-init. forum-service tiene su propio usuario.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?falta MONGO_ROOT_USER en el .env (ver .env.example)}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?falta MONGO_ROOT_PASSWORD en el .env (ver .env.example)}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Crea el usuario de forum-service con permiso sólo sobre la base `forum`.
  # Corre una vez en cada `up` y termina; el script es idempotente.
  mongo-init:
    image: mongo:7.0
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_ROOT_USER: ${MONGO_ROOT_USER}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      FORUM_DB_USER: ${FORUM_DB_USER:?falta FORUM_DB_USER en el .env (ver .env.example)}
      FORUM_DB_PASSWORD: ${FORUM_DB_PASSWORD:?falta FORUM_DB_PASSWORD en el .env (ver .env.example)}
    volumes:
      - ./deploy/mongo:/scripts:ro
    entrypoint: ["sh", "-c", "mongosh --quiet --host mongo -u \"$$MONGO_ROOT_USER\" -p \"$$MONGO_ROOT_PASSWORD\" --authenticationDatabase admin /scripts/init-databases.js"]
    restart: "no"

  # MinIO (S3) para los PDF. Las imágenes oficiales ya no se publican en Docker
  # Hub: se usa la de Bitnami, que es el mismo MinIO, con versión fija.
  minio:
    image: bitnamilegacy/minio:2025.4.22
    ports:
      - "9000:9000" # API S3
      - "9001:9001" # consola web
    environment:
      # Administrador del contenedor: sólo lo usa minio-init. forum-service tiene su propio usuario.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?falta MINIO_ROOT_USER en el .env (ver .env.example)}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?falta MINIO_ROOT_PASSWORD en el .env (ver .env.example)}
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Crea el bucket `summaries` y el usuario de forum-service con permiso sólo
  # sobre ese bucket. Corre una vez en cada `up` y termina; es idempotente.
  minio-init:
    image: bitnamilegacy/minio:2025.4.22
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      FORUM_MINIO_ACCESS_KEY: ${FORUM_MINIO_ACCESS_KEY:?falta FORUM_MINIO_ACCESS_KEY en el .env (ver .env.example)}
      FORUM_MINIO_SECRET_KEY: ${FORUM_MINIO_SECRET_KEY:?falta FORUM_MINIO_SECRET_KEY en el .env (ver .env.example)}
    volumes:
      - ./deploy/minio:/scripts:ro
    entrypoint: ["sh", "/scripts/init-storage.sh"]
    restart: "no"

  # ---------------------------------------------------------------
  # Observabilidad
  # ---------------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    ports:
      - "16686:16686" # interfaz web
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    restart: unless-stopped

volumes:
  postgres-data:
  mongo-data:
  minio-data:
